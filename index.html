


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Write the Calculation from a Number Line – Mr. McLean Math</title>
<style>
:root{
  --bg:#fff;--fg:#111;--card:#f7f7f9;--muted:#666;--pos:#0b57d0;--neg:#c0392b;
  --zero:#111;--arrow:#c0392b;--ok:#1b8f2e;--bad:#c62828;--border:#ddd;--accent:#0b57d0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Arial,Helvetica,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:20px 14px 28px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:clamp(24px,3vw,34px)}
.subtitle{margin-top:5px;color:var(--muted);font-size:14px}
.tabs,.levels,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;border:1px solid #bbb;background:#fff;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
button.active,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:15px}
.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
.svgbox{max-width:860px;margin:0 auto}
.options{display:grid;gap:10px;margin-top:12px}
@media(min-width:700px){.options{grid-template-columns:1fr 1fr}}
.opt{padding:11px 12px;border:1px solid #cfcfcf;border-radius:12px;text-align:center;background:#fafafa;cursor:pointer}
.opt.selected{outline:3px solid #91b7ff}
.opt.correct{border-color:var(--ok);background:#f2fbf4}
.opt.wrong{border-color:var(--bad);background:#fff3f3}
.eq{font-size:21px}
.controls{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.feedback{min-height:48px;margin-top:10px;padding:10px 12px;border-radius:10px;background:#fafafa}
.feedback.ok{color:var(--ok);font-weight:800}.feedback.bad{color:var(--bad);font-weight:800}
.steps{display:none;margin-top:8px;background:var(--card);border-radius:12px;padding:10px 12px;line-height:1.55}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.stat{padding:7px 11px;border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:800}
.worksheet{display:none}
.ws-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select{font:inherit;border:1px solid #bbb;border-radius:10px;padding:9px 10px;background:#fff}
#columns{display:flex;flex-direction:column;gap:14px}
.wcard{border:1px solid #e2e2e2;border-radius:12px;background:#fafafa;padding:10px 12px}
.wcard h3{margin:0 0 6px;font-size:16px}
.wans{display:none;font-weight:700;margin-top:6px}.wans.show{display:block}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
@media print{
  body{background:#fff}.wrap{max-width:none;padding:0}
  header,#practiceCard,.no-print,.footer{display:none!important}
  #worksheetCard{display:block!important;border:0;padding:0}
  .wans{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Write the Calculation from a Number Line</h1>
    <div class="subtitle">Match the arrow to the correct calculation.</div>
  </div>
  <div class="tabs">
    <button id="practiceTab" class="active" type="button">Practice</button>
    <button id="worksheetTab" type="button">Worksheet</button>
  </div>
</header>

<section id="practiceCard" class="card">
  <div class="toolbar">
    <div>
      <div class="label">Difficulty</div>
      <div class="levels">
        <button class="level active" data-diff="easy" type="button">Foundation</button>
        <button class="level" data-diff="medium" type="button">Core</button>
        <button class="level" data-diff="hard" type="button">Challenge</button>
      </div>
    </div>
    <button id="newBtn" type="button">New Question</button>
  </div>

  <div id="lineBox" class="svgbox"></div>
  <div id="options" class="options"></div>

  <div class="controls">
    <button id="clearBtn" type="button">Clear</button>
    <button id="submitBtn" class="primary" type="button">Check</button>
    <button id="nextBtn" type="button" disabled>Next</button>
  </div>

  <div id="feedback" class="feedback">Choose the calculation that matches the arrow.</div>
  <div id="steps" class="steps"></div>

  <div class="stats">
    <div class="stat">Correct: <span id="correct">0</span></div>
    <div class="stat">Incorrect: <span id="incorrect">0</span></div>
  </div>
</section>

<section id="worksheetCard" class="card worksheet">
  <div class="ws-top">
    <div>
      <div style="font-size:19px;font-weight:900">Worksheet</div>
      <div id="wsMeta" class="subtitle">Write the calculation that matches each arrow.</div>
    </div>
    <div class="row no-print">
      <label style="font-size:13px;font-weight:800">Questions
        <select id="wsSize"><option>5</option><option selected>10</option><option>15</option></select>
      </label>
      <button id="genWS" class="primary" type="button">Generate</button>
      <button id="revealAll" type="button" disabled>Reveal All</button>
      <button id="hideAll" type="button" disabled>Hide All</button>
      <button id="printBtn" type="button" disabled>Print</button>
    </div>
  </div>
  <div id="columns"></div>
</section>

<div class="footer">Created by Mr. McLean Math.</div>
</div>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

function tierSettings(diff){
  if(diff==="easy")return {min:-10,max:10,minStep:1,maxStep:6,crossProb:.2,capStep1:.3};
  if(diff==="medium")return {min:-15,max:15,minStep:3,maxStep:10,crossProb:.4,capStep1:0};
  return {min:-20,max:20,minStep:6,maxStep:15,crossProb:.6,capStep1:0};
}
function genProblem(diff){
  const t=tierSettings(diff),wantCross=Math.random()<t.crossProb;
  for(let tries=0;tries<500;tries++){
    let step=randInt(t.minStep,t.maxStep);
    if(step===1&&Math.random()>t.capStep1)step=Math.min(t.maxStep,Math.max(2,step+randInt(0,2)));
    const c=(Math.random()<.5?-1:1)*step;
    const s=randInt(t.min,t.max),e=s+c;
    if(e<t.min||e>t.max)continue;
    const crosses=(s*e<=0&&s!==e);
    if(wantCross!==crosses)continue;
    return {min:t.min,max:t.max,s,c,e};
  }
  return {min:t.min,max:t.max,s:0,c:t.minStep,e:t.minStep};
}
function formatEq(s,c,e){return `${s} ${c>=0?"+":"−"} ${Math.abs(c)} = ${e}`}
function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function buildMC(p){
  const {s,c,e}=p,correct=formatEq(s,c,e),opts=new Set([correct]);
  opts.add(formatEq(s,-c,e));
  const near=e+(c>0?-1:1);
  opts.add(Math.random()<.5?formatEq(s,Math.abs(c),near):formatEq(s,(c>=0?1:-1)*Math.max(1,Math.abs(c)-1),e));
  opts.add(formatEq(e,-c,s));
  const candidates=[];
  for(const sign of [-1,1]){
    for(const delta of [-2,-1,1,2]){
      const tweak=sign*Math.max(1,Math.abs(c)+delta);
      candidates.push(formatEq(s,tweak,e));
      candidates.push(formatEq(s,tweak,s+tweak));
    }
  }
  for(const x of shuffle(candidates)){opts.add(x);if(opts.size>=4)break}
  const all=shuffle([...opts].slice(0,4));
  return {choices:all,correctIndex:all.indexOf(correct)};
}
function numberLineSVG(p){
  const baseW=1024,baseH=180,padL=42,padR=42,L=padL,R=baseW-padR,Y=Math.round(baseH/2)+12;
  const scale=x=>L+((x-p.min)/(p.max-p.min))*(R-L);
  const sX=scale(p.s),eX=scale(p.e),dir=eX>=sX?1:-1;
  let labels="";
  for(let v=p.min;v<=p.max;v++){
    const x=scale(v),color=v===0?"var(--zero)":v<0?"var(--neg)":"var(--pos)",tick=v===0?16:12;
    labels+=`<line x1="${x}" y1="${Y-tick/2}" x2="${x}" y2="${Y+tick/2}" stroke="${color}" stroke-width="${v===0?3:2}"/>
    <text x="${x}" y="${Y+28}" text-anchor="middle" font-size="18" fill="${color}" font-weight="${v===0?700:500}">${v}</text>`;
  }
  // Use a tall arch like the classroom example, landing on the destination tick.
  // Keep the large head aligned with the descending end of the arch.
  const tipY=Y-(p.e===0?8:6),headLength=26,headHalfHeight=14;
  const ux=dir*0.5,uy=Math.sqrt(3)/2;
  const baseX=eX-ux*headLength,baseY=tipY-uy*headLength;
  const corner1X=baseX-uy*headHalfHeight,corner1Y=baseY+ux*headHalfHeight;
  const corner2X=baseX+uy*headHalfHeight,corner2Y=baseY-ux*headHalfHeight;
  const span=Math.abs(eX-sX);
  const path=`M ${sX} ${Y-20} C ${sX+dir*span*0.22} ${Y-94} ${baseX-ux*48} ${baseY-uy*48} ${baseX} ${baseY}`;
  return `<svg width="100%" height="${baseH}" viewBox="0 0 ${baseW} ${baseH}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Number line from ${p.min} to ${p.max} with arrow from ${p.s} to ${p.e}">
    <line x1="${L}" y1="${Y}" x2="${R}" y2="${Y}" stroke="#555" stroke-width="3"/>
    ${labels}
    <path d="${path}" fill="none" stroke="var(--arrow)" stroke-width="5"/>
    <path d="M ${eX} ${tipY} L ${corner1X} ${corner1Y} L ${corner2X} ${corner2Y} Z" fill="var(--arrow)"/>
  </svg>`;
}

let difficulty="easy",current=null,mc=null,selected=null,evaluated=false,correct=0,incorrect=0;

function newQuestion(){
  current=genProblem(difficulty);mc=buildMC(current);selected=null;evaluated=false;
  $("lineBox").innerHTML=numberLineSVG(current);
  const box=$("options");box.innerHTML="";
  mc.choices.forEach((txt,i)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";b.dataset.index=i;
    b.innerHTML=`<span class="eq">${txt}</span>`;
    b.addEventListener("click",()=>{
      if(evaluated)return;
      selected=i;box.querySelectorAll(".opt").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");
    });
    box.appendChild(b);
  });
  $("feedback").className="feedback";$("feedback").textContent="Choose the calculation that matches the arrow.";
  $("steps").style.display="none";$("steps").innerHTML="";
  $("submitBtn").disabled=false;$("nextBtn").disabled=true;
}
function submit(){
  if(evaluated)return;
  if(selected===null){$("feedback").className="feedback";$("feedback").textContent="Choose an option first.";return}
  evaluated=true;$("submitBtn").disabled=true;$("nextBtn").disabled=false;
  const ok=selected===mc.correctIndex;
  $("options").querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled=true;if(i===mc.correctIndex)b.classList.add("correct");if(i===selected&&!ok)b.classList.add("wrong");
  });
  const eq=formatEq(current.s,current.c,current.e);
  if(ok){
    correct++;$("correct").textContent=correct;$("feedback").className="feedback ok";$("feedback").textContent="Correct!";
  }else{
    incorrect++;$("incorrect").textContent=incorrect;$("feedback").className="feedback bad";$("feedback").textContent=`Incorrect. Correct answer: ${eq}`;
    $("steps").innerHTML=`Start at <b>${current.s}</b>.<br>Move <b>${Math.abs(current.c)}</b> steps ${current.c>0?"right (+)":"left (−)"}.<br>End at <b>${current.e}</b>.<br>Calculation: <b>${eq}</b>.`;
    $("steps").style.display="block";
  }
}
function clearChoice(){
  if(evaluated)return;selected=null;$("options").querySelectorAll(".opt").forEach(x=>x.classList.remove("selected"));
}
document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));b.classList.add("active");difficulty=b.dataset.diff;newQuestion();
}));
$("newBtn").addEventListener("click",newQuestion);$("submitBtn").addEventListener("click",submit);$("nextBtn").addEventListener("click",newQuestion);$("clearBtn").addEventListener("click",clearChoice);

document.addEventListener("keydown",e=>{
  if($("practiceCard").style.display==="none")return;
  if(["1","2","3","4"].includes(e.key)&&!evaluated){
    const i=Number(e.key)-1,b=$(`option-${i}`);
    const opts=$("options").querySelectorAll(".opt");
    if(opts[i])opts[i].click();
  }else if(e.key==="Enter"){e.preventDefault();evaluated?newQuestion():submit()}
  else if(e.key==="Escape"){e.preventDefault();clearChoice()}
});

function showPractice(){$("practiceTab").classList.add("active");$("worksheetTab").classList.remove("active");$("practiceCard").style.display="block";$("worksheetCard").style.display="none"}
function showWorksheet(){$("worksheetTab").classList.add("active");$("practiceTab").classList.remove("active");$("practiceCard").style.display="none";$("worksheetCard").style.display="block"}
$("practiceTab").addEventListener("click",showPractice);$("worksheetTab").addEventListener("click",showWorksheet);

function generateWorksheet(){
  const n=Number($("wsSize").value),container=$("columns");container.innerHTML="";
  for(let i=1;i<=n;i++){
    const p=genProblem(difficulty),eq=formatEq(p.s,p.c,p.e),card=document.createElement("div");card.className="wcard";
    card.innerHTML=`<h3>${i}.</h3><div class="svgbox">${numberLineSVG(p)}</div>`;
    const ans=document.createElement("div");ans.className="wans";ans.innerHTML=`Answer: <b>${eq}</b>`;
    const btn=document.createElement("button");btn.type="button";btn.className="no-print";btn.textContent="Reveal";
    btn.addEventListener("click",()=>{ans.classList.toggle("show");btn.textContent=ans.classList.contains("show")?"Hide":"Reveal"});
    card.append(btn,ans);container.appendChild(card);
  }
  const labels={easy:"Foundation",medium:"Core",hard:"Challenge"};$("wsMeta").textContent=`${labels[difficulty]} • ${n} questions`;
  $("revealAll").disabled=$("hideAll").disabled=$("printBtn").disabled=false;
}
$("genWS").addEventListener("click",generateWorksheet);
$("revealAll").addEventListener("click",()=>document.querySelectorAll(".wans").forEach(x=>x.classList.add("show")));
$("hideAll").addEventListener("click",()=>document.querySelectorAll(".wans").forEach(x=>x.classList.remove("show")));
$("printBtn").addEventListener("click",()=>window.print());

window.__MMM_TEST__={genProblem,buildMC,tierSettings};
newQuestion();
})();
</script>
</body>
</html>
